<script>
(function () {
  var C = window.Chords;
  var esc = C.esc;
  var THAI_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  var KEY_OPTIONS = C.MAJOR_KEY_NAMES.concat(['C#', 'Gb', 'Cb']).concat(C.MINOR_KEY_NAMES).concat(['D#m', 'Abm', 'A#m']);
  var ROLE_LEVEL = { viewer: 1, leader: 2, admin: 3 };
  var ROLE_LABEL = { viewer: 'ดูอย่างเดียว', leader: 'ผู้นำเพลง', admin: 'ผู้ดูแลระบบ' };
  var LAYOUT_LABEL = { auto: 'อัตโนมัติ', half: 'ครึ่งหน้า (2 เพลง/หน้า)', full: 'เต็มหน้า' };
  var ACC_LABEL = { auto: 'อัตโนมัติ', sharp: '#', flat: 'b' };

  var state = {
    token: null,
    user: null,
    view: 'library',
    songs: [],
    songsLoaded: false,
    search: '',
    sort: 'title',
    current: null,
    viewShift: 0,
    viewAcc: 'auto',
    viewZoom: 16,
    editing: null,
    builder: null,
    leaders: [],
    setlists: [],
    stats: null,
    statsFilter: { from: '', to: '', leader: '' },
    statsLeader: '',
    users: [],
    pickerQuery: '',
    lastResult: null,
    busy: 0
  };

  function store(key, value) {
    try {
      if (value === null) {
        localStorage.removeItem(key);
      } else {
        localStorage.setItem(key, JSON.stringify(value));
      }
    } catch (e) {
    }
  }

  function load(key) {
    try {
      var v = localStorage.getItem(key);
      return v ? JSON.parse(v) : null;
    } catch (e) {
      return null;
    }
  }

  function $(id) {
    return document.getElementById(id);
  }

  function setBusy(delta) {
    state.busy = Math.max(0, state.busy + delta);
    $('loading').classList.toggle('hide', state.busy === 0);
  }

  function toast(msg, isErr) {
    var el = document.createElement('div');
    el.className = 'toast' + (isErr ? ' err' : '');
    el.textContent = msg;
    $('toastRoot').appendChild(el);
    setTimeout(function () { el.remove(); }, isErr ? 5000 : 2800);
  }

  function modal(html, onReady) {
    $('modalRoot').innerHTML = '<div class="overlay" id="overlay"><div class="modal">' + html + '</div></div>';
    if (onReady) {
      onReady();
    }
  }

  function closeModal() {
    $('modalRoot').innerHTML = '';
  }

  function confirmBox(message, okLabel) {
    return new Promise(function (resolve) {
      modal('<h3>ยืนยัน</h3><p>' + esc(message) + '</p><div class="row" style="justify-content:flex-end"><button class="btn" id="mNo">ยกเลิก</button><button class="btn primary" id="mYes">' + esc(okLabel || 'ตกลง') + '</button></div>', function () {
        $('mNo').onclick = function () { closeModal(); resolve(false); };
        $('mYes').onclick = function () { closeModal(); resolve(true); };
      });
    });
  }

  function api(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    setBusy(1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(function (res) { setBusy(-1); resolve(res); })
        .withFailureHandler(function (err) {
          setBusy(-1);
          var msg = err && err.message ? err.message : String(err);
          if (msg.indexOf('SESSION_EXPIRED') >= 0) {
            forceLogout('หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบใหม่');
            reject(new Error('SESSION_EXPIRED'));
            return;
          }
          reject(new Error(msg.replace(/^Error:\s*/, '').replace(/^Exception:\s*/, '')));
        });
      if (fn === 'login') {
        runner[fn].apply(runner, args);
      } else {
        runner[fn].apply(runner, [state.token].concat(args));
      }
    });
  }

  function fail(e) {
    if (e && e.message !== 'SESSION_EXPIRED') {
      toast(e.message, true);
    }
  }

  function can(role) {
    return state.user && (ROLE_LEVEL[state.user.role] || 0) >= ROLE_LEVEL[role];
  }

  function pad2(n) {
    return (n < 10 ? '0' : '') + n;
  }

  function isoDate(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function nextSunday() {
    var d = new Date();
    d.setDate(d.getDate() + ((7 - d.getDay()) % 7));
    return isoDate(d);
  }

  function thaiShortDate(iso) {
    var p = String(iso || '').split('-');
    if (p.length !== 3) {
      return iso || '';
    }
    return Number(p[2]) + ' ' + THAI_MONTHS[Number(p[1]) - 1] + p[0];
  }

  function defaultTitle(iso) {
    return 'เพลงนมัสการอาทิตย์ที่ ' + thaiShortDate(iso);
  }

  function newBuilder() {
    var date = nextSunday();
    return {
      title: defaultTitle(date),
      titleAuto: true,
      serviceDate: date,
      leader: state.user ? state.user.displayName : '',
      description: '',
      outputType: 'pdf',
      items: []
    };
  }

  function saveBuilder() {
    if (!state.builder) {
      return;
    }
    var copy = JSON.parse(JSON.stringify(state.builder));
    copy.items.forEach(function (it) { delete it.content; });
    store('cs_builder', copy);
  }

  function forceLogout(msg) {
    state.token = null;
    state.user = null;
    store('cs_token', null);
    renderLogin();
    if (msg) {
      toast(msg, true);
    }
  }

  function renderNav() {
    var items = [
      ['library', 'เพลงทั้งหมด'],
      ['builder', 'ชุดเพลง' + (state.builder && state.builder.items.length ? ' (' + state.builder.items.length + ')' : ''), 'leader'],
      ['history', 'ประวัติชุดเพลง'],
      ['stats', 'สถิติ'],
      ['users', 'ผู้ใช้', 'admin'],
      ['account', 'บัญชีของฉัน']
    ];
    $('nav').innerHTML = items.filter(function (i) { return !i[2] || can(i[2]); }).map(function (i) {
      var active = state.view === i[0] || (i[0] === 'library' && (state.view === 'song' || state.view === 'editor'));
      return '<button class="' + (active ? 'active' : '') + '" data-nav="' + i[0] + '">' + esc(i[1]) + '</button>';
    }).join('') + '<button data-nav="logout">ออกจากระบบ</button>';
    $('who').textContent = state.user.displayName + ' · ' + (ROLE_LABEL[state.user.role] || state.user.role);
    Array.prototype.forEach.call($('nav').querySelectorAll('[data-nav]'), function (b) {
      b.onclick = function () { go(b.getAttribute('data-nav')); };
    });
  }

  function go(view) {
    if (view === 'logout') {
      api('logout').catch(function () {});
      forceLogout();
      return;
    }
    state.view = view;
    window.scrollTo(0, 0);
    render();
  }

  function render() {
    $('topbar').classList.remove('hide');
    renderNav();
    var v = state.view;
    if (v === 'library') { renderLibrary(); }
    else if (v === 'song') { renderSong(); }
    else if (v === 'editor') { renderEditor(); }
    else if (v === 'builder') { renderBuilder(); }
    else if (v === 'history') { renderHistory(); }
    else if (v === 'stats') { renderStats(); }
    else if (v === 'users') { renderUsers(); }
    else if (v === 'account') { renderAccount(); }
  }

  function renderLogin() {
    $('topbar').classList.add('hide');
    $('view').innerHTML =
      '<div class="card login">' +
      '<h1>เข้าสู่ระบบ</h1><p class="muted">ระบบเนื้อเพลงและคอร์ด</p>' +
      '<label class="f">Username</label><input type="text" id="lgUser" autocomplete="username">' +
      '<div style="height:10px"></div>' +
      '<label class="f">รหัสผ่าน</label><input type="password" id="lgPass" autocomplete="current-password">' +
      '<div style="height:14px"></div>' +
      '<button class="btn primary" id="lgBtn" style="width:100%;justify-content:center">เข้าสู่ระบบ</button>' +
      '</div>';
    var submit = function () {
      var u = $('lgUser').value.trim();
      var p = $('lgPass').value;
      if (!u || !p) {
        toast('กรุณากรอก Username และรหัสผ่าน', true);
        return;
      }
      $('lgBtn').disabled = true;
      api('login', u, p).then(function (res) {
        state.token = res.token;
        state.user = res.user;
        store('cs_token', res.token);
        afterLogin();
      }).catch(function (e) {
        $('lgBtn').disabled = false;
        fail(e);
      });
    };
    $('lgBtn').onclick = submit;
    $('lgPass').onkeydown = function (e) { if (e.key === 'Enter') { submit(); } };
    $('lgUser').onkeydown = function (e) { if (e.key === 'Enter') { $('lgPass').focus(); } };
    $('lgUser').focus();
  }

  function afterLogin() {
    var saved = load('cs_builder');
    state.builder = saved && saved.items ? saved : newBuilder();
    if (!state.builder.leader) {
      state.builder.leader = state.user.displayName;
    }
    state.view = 'library';
    render();
    refreshSongs();
    api('listLeaderNames').then(function (names) { state.leaders = names; }).catch(fail);
    var ids = state.builder.items.map(function (it) { return it.songId; });
    if (ids.length) {
      api('getSongs', ids).then(function (map) {
        state.builder.items = state.builder.items.filter(function (it) { return map[it.songId]; });
        state.builder.items.forEach(function (it) {
          var s = map[it.songId];
          it.content = s.content;
          it.title = s.title;
          it.originalKey = s.originalKey;
        });
        saveBuilder();
        if (state.view === 'builder') {
          renderBuilder();
        }
        renderNav();
      }).catch(fail);
    }
  }

  function refreshSongs() {
    return api('listSongs').then(function (songs) {
      state.songs = songs;
      state.songsLoaded = true;
      if (state.view === 'library') {
        renderLibraryList();
      }
    }).catch(fail);
  }

  function songMatches(s, q) {
    if (!q) {
      return true;
    }
    var hay = (s.title + ' ' + s.artist + ' ' + s.tags + ' ' + (s.searchText || '')).toLowerCase();
    return q.toLowerCase().split(/\s+/).filter(Boolean).every(function (w) { return hay.indexOf(w) >= 0; });
  }

  function renderLibrary() {
    $('view').innerHTML =
      '<div class="card">' +
      '<div class="row"><div class="grow"><h1>เพลงทั้งหมด</h1><div class="muted" id="libCount"></div></div>' +
      (can('leader') ? '<button class="btn primary" id="btnNewSong">+ เพิ่มเพลงใหม่</button>' : '') +
      '</div><div style="height:12px"></div>' +
      '<div class="row"><input type="search" class="grow" id="libSearch" placeholder="ค้นหาชื่อเพลง ผู้แต่ง แท็ก หรือเนื้อเพลง" value="' + esc(state.search) + '">' +
      '<select id="libSort" style="width:auto">' +
      '<option value="title">เรียงตามชื่อ</option><option value="uses">ใช้บ่อยที่สุด</option><option value="last">ใช้ล่าสุด</option><option value="updated">แก้ไขล่าสุด</option>' +
      '</select></div></div>' +
      '<div class="card"><div id="libList"></div></div>';
    $('libSort').value = state.sort;
    $('libSearch').oninput = function () { state.search = this.value; renderLibraryList(); };
    $('libSort').onchange = function () { state.sort = this.value; renderLibraryList(); };
    if ($('btnNewSong')) {
      $('btnNewSong').onclick = function () { openEditor(null); };
    }
    renderLibraryList();
  }

  function sortedSongs() {
    var list = state.songs.filter(function (s) { return songMatches(s, state.search); });
    var sorters = {
      title: function (a, b) { return a.title.localeCompare(b.title, 'th'); },
      uses: function (a, b) { return b.useCount - a.useCount || a.title.localeCompare(b.title, 'th'); },
      last: function (a, b) { return (b.lastUsed || '').localeCompare(a.lastUsed || '') || a.title.localeCompare(b.title, 'th'); },
      updated: function (a, b) { return (b.updatedAt || '').localeCompare(a.updatedAt || ''); }
    };
    return list.sort(sorters[state.sort] || sorters.title);
  }

  function renderLibraryList() {
    var el = $('libList');
    if (!el) {
      return;
    }
    if (!state.songsLoaded) {
      el.innerHTML = '<p class="muted">กำลังโหลด...</p>';
      return;
    }
    var list = sortedSongs();
    $('libCount').textContent = 'ทั้งหมด ' + state.songs.length + ' เพลง' + (state.search ? ' · พบ ' + list.length + ' เพลง' : '');
    if (!list.length) {
      el.innerHTML = '<p class="muted">ไม่พบเพลง</p>';
      return;
    }
    var inBuilder = {};
    if (state.builder) {
      state.builder.items.forEach(function (it) { inBuilder[it.songId] = true; });
    }
    el.innerHTML = '<table class="list"><thead><tr><th>ชื่อเพลง</th><th>คีย์</th><th>ใช้ไปแล้ว</th><th>ใช้ล่าสุด</th><th></th></tr></thead><tbody>' +
      list.map(function (s) {
        return '<tr><td><span class="song-title-link" data-open="' + esc(s.id) + '">' + esc(s.title) + '</span>' +
          (s.artist ? '<div class="muted">' + esc(s.artist) + '</div>' : '') +
          (s.tags ? '<div>' + s.tags.split(',').map(function (t) { return t.trim() ? '<span class="pill gray">' + esc(t.trim()) + '</span> ' : ''; }).join('') + '</div>' : '') +
          '</td><td>' + (s.originalKey ? '<span class="pill">' + esc(s.originalKey) + '</span>' : '<span class="muted">-</span>') + '</td>' +
          '<td>' + s.useCount + ' ครั้ง</td><td>' + (s.lastUsed ? esc(thaiShortDate(s.lastUsed)) : '<span class="muted">-</span>') + '</td>' +
          '<td style="text-align:right;white-space:nowrap">' +
          (can('leader') ? '<button class="btn sm" data-add="' + esc(s.id) + '"' + (inBuilder[s.id] ? ' disabled' : '') + '>' + (inBuilder[s.id] ? '✓ อยู่ในชุดแล้ว' : '+ ชุดเพลง') + '</button>' : '') +
          '</td></tr>';
      }).join('') + '</tbody></table>';
    Array.prototype.forEach.call(el.querySelectorAll('[data-open]'), function (b) {
      b.onclick = function () { openSong(b.getAttribute('data-open')); };
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-add]'), function (b) {
      b.onclick = function () { addToBuilder(b.getAttribute('data-add'), 0, 'auto'); };
    });
  }

  function openSong(id) {
    api('getSong', id).then(function (song) {
      state.current = song;
      state.viewShift = 0;
      state.viewAcc = 'auto';
      state.view = 'song';
      render();
    }).catch(fail);
  }

  function renderSong() {
    var s = state.current;
    if (!s) {
      go('library');
      return;
    }
    var prepared = C.prepareForOutput(s, state.viewShift, state.viewAcc);
    $('view').innerHTML =
      '<div class="card">' +
      '<div class="row"><button class="btn sm" id="backLib">← กลับ</button></div><div style="height:10px"></div>' +
      '<div class="row"><div class="grow"><h1>' + esc(s.title) + '</h1>' +
      '<div class="muted">' + (s.artist ? esc(s.artist) + ' · ' : '') + 'คีย์เดิม ' + esc(s.originalKey || '-') + ' · แก้ไขล่าสุดโดย ' + esc(s.updatedBy || '-') + '</div></div>' +
      '<div class="row">' +
      (can('leader') ? '<button class="btn" id="btnEdit">แก้ไข</button>' : '') +
      (can('admin') ? '<button class="btn danger" id="btnDel">ลบ</button>' : '') +
      (can('leader') ? '<button class="btn primary" id="btnAdd">+ เพิ่มลงชุดเพลง</button>' : '') +
      '</div></div><div style="height:12px"></div>' +
      '<div class="row">' +
      '<span class="keybox"><button id="kDown">− ½</button><span class="k">' + esc(prepared.key || C.shiftLabel(state.viewShift)) + '</span><button id="kUp">+ ½</button></span>' +
      '<span class="muted">เลื่อน ' + C.shiftLabel(state.viewShift) + ' ครึ่งเสียง</span>' +
      '<select id="kAcc" style="width:auto"><option value="auto">#/b อัตโนมัติ</option><option value="sharp">ใช้ #</option><option value="flat">ใช้ b</option></select>' +
      '<button class="btn sm" id="kReset">คีย์เดิม</button>' +
      '<span class="keybox"><button id="zOut">A−</button><span class="k" style="min-width:40px">' + state.viewZoom + '</span><button id="zIn">A+</button></span>' +
      '</div></div>' +
      '<div class="card"><div class="sheet" style="font-size:' + state.viewZoom + 'px">' + C.renderHtml(prepared.content) + '</div></div>';
    $('kAcc').value = state.viewAcc;
    $('backLib').onclick = function () { go('library'); };
    $('kDown').onclick = function () { state.viewShift = shiftStep(state.viewShift, -1); renderSong(); };
    $('kUp').onclick = function () { state.viewShift = shiftStep(state.viewShift, 1); renderSong(); };
    $('kReset').onclick = function () { state.viewShift = 0; state.viewAcc = 'auto'; renderSong(); };
    $('kAcc').onchange = function () { state.viewAcc = this.value; renderSong(); };
    $('zOut').onclick = function () { state.viewZoom = Math.max(11, state.viewZoom - 1); renderSong(); };
    $('zIn').onclick = function () { state.viewZoom = Math.min(30, state.viewZoom + 1); renderSong(); };
    if ($('btnEdit')) {
      $('btnEdit').onclick = function () { openEditor(s); };
    }
    if ($('btnAdd')) {
      $('btnAdd').onclick = function () { addToBuilder(s.id, state.viewShift, state.viewAcc); };
    }
    if ($('btnDel')) {
      $('btnDel').onclick = function () {
        confirmBox('ลบเพลง "' + s.title + '" ? (ประวัติการใช้งานยังเก็บไว้)', 'ลบ').then(function (ok) {
          if (!ok) {
            return;
          }
          api('deleteSong', s.id).then(function () {
            toast('ลบเพลงแล้ว');
            state.current = null;
            refreshSongs();
            go('library');
          }).catch(fail);
        });
      };
    }
  }

  function shiftStep(shift, delta) {
    var n = shift + delta;
    if (n > 11) { n -= 12; }
    if (n < -11) { n += 12; }
    return n;
  }

  function openEditor(song) {
    state.editing = song ? JSON.parse(JSON.stringify(song)) : { id: '', title: '', artist: '', originalKey: '', tags: '', defaultLayout: 'auto', content: '' };
    state.view = 'editor';
    render();
  }

  function renderEditor() {
    var s = state.editing;
    $('view').innerHTML =
      '<div class="card"><div class="row"><button class="btn sm" id="edBack">← ยกเลิก</button><div class="grow"><h1>' + (s.id ? 'แก้ไขเพลง' : 'เพิ่มเพลงใหม่') + '</h1></div>' +
      '<button class="btn primary" id="edSave">บันทึก</button></div></div>' +
      '<div class="card"><div class="grid2">' +
      '<div><label class="f">ชื่อเพลง *</label><input type="text" id="edTitle" value="' + esc(s.title) + '"></div>' +
      '<div><label class="f">ผู้แต่ง / ศิลปิน</label><input type="text" id="edArtist" value="' + esc(s.artist) + '"></div>' +
      '<div><label class="f">คีย์เดิมของเพลง</label><input type="text" id="edKey" list="keyList" value="' + esc(s.originalKey) + '" placeholder="เช่น C, G, Bb, Am">' +
      '<datalist id="keyList">' + KEY_OPTIONS.map(function (k) { return '<option value="' + k + '">'; }).join('') + '</datalist></div>' +
      '<div><label class="f">การจัดหน้าเริ่มต้น</label><select id="edLayout"><option value="auto">อัตโนมัติ</option><option value="half">ครึ่งหน้า (2 เพลง/หน้า)</option><option value="full">เต็มหน้า</option></select></div>' +
      '<div style="grid-column:1/-1"><label class="f">แท็ก (คั่นด้วย ,)</label><input type="text" id="edTags" value="' + esc(s.tags) + '" placeholder="เช่น สรรเสริญ, นมัสการ, ช้า"></div>' +
      '</div></div>' +
      '<div class="grid2">' +
      '<div class="card"><div class="row"><h3 class="grow">เนื้อเพลง + คอร์ด</h3><button class="btn sm" id="edConvert">แปลงจากแบบคอร์ดอยู่บรรทัดบน</button></div>' +
      '<textarea class="code" id="edContent" spellcheck="false" placeholder="[C]ตัวอย่าง[G]เนื้อเพลง[Am]บรรทัดแรก"></textarea>' +
      '<div style="height:8px"></div><div class="help">' +
      'วางคอร์ดในวงเล็บเหลี่ยมหน้าพยางค์ที่ต้องการ เช่น <code>[C]ร้อง[G/B]เพลง[Am7]ถวาย</code><br>' +
      'บรรทัดดนตรีล้วน เช่น <code>Intro: [C] [G/B] [F] [Gsus4]</code> หรือ <code>Solo: [Am7 Em7 F G] x2</code><br>' +
      'หัวข้อท่อน เช่น <code>Chorus:</code> <code>Bridge:</code> จะแสดงเป็นตัวหนา · เว้นบรรทัดว่างเพื่อแบ่งท่อน<br>' +
      'ถ้าคัดลอกเพลงมาจาก Word ที่คอร์ดอยู่บรรทัดบน ให้วางลงไปแล้วกด "แปลงจากแบบคอร์ดอยู่บรรทัดบน" จากนั้นตรวจตำแหน่งคอร์ดในตัวอย่างด้านขวา' +
      '</div></div>' +
      '<div class="card"><div class="row"><h3 class="grow">ตัวอย่าง</h3></div><div class="sheet" id="edPreview"></div></div>' +
      '</div>';
    $('edContent').value = s.content;
    $('edLayout').value = s.defaultLayout || 'auto';
    var updatePreview = function () {
      s.content = $('edContent').value;
      $('edPreview').innerHTML = C.renderHtml(s.content);
    };
    updatePreview();
    $('edContent').oninput = updatePreview;
    $('edConvert').onclick = function () {
      $('edContent').value = C.convertChordsOverLyrics($('edContent').value);
      updatePreview();
      toast('แปลงแล้ว กรุณาตรวจตำแหน่งคอร์ด');
    };
    $('edBack').onclick = function () {
      if (s.id && state.current && state.current.id === s.id) {
        state.view = 'song';
        render();
      } else {
        go('library');
      }
    };
    $('edSave').onclick = function () { saveEditor(false); };
  }

  function saveEditor(allowDuplicate) {
    var s = state.editing;
    var key = $('edKey').value.trim();
    if (key && !C.parseKey(key)) {
      toast('รูปแบบคีย์ไม่ถูกต้อง ใช้เช่น C, F#, Bb, Am', true);
      return;
    }
    var data = {
      id: s.id,
      title: $('edTitle').value,
      artist: $('edArtist').value,
      originalKey: key,
      defaultLayout: $('edLayout').value,
      tags: $('edTags').value,
      content: $('edContent').value,
      allowDuplicate: allowDuplicate
    };
    api('saveSong', data).then(function (saved) {
      toast('บันทึกเพลงแล้ว');
      state.current = saved;
      state.viewShift = 0;
      state.viewAcc = 'auto';
      state.editing = null;
      if (state.builder) {
        state.builder.items.forEach(function (it) {
          if (it.songId === saved.id) {
            it.content = saved.content;
            it.title = saved.title;
            it.originalKey = saved.originalKey;
          }
        });
      }
      state.view = 'song';
      render();
      refreshSongs();
    }).catch(function (e) {
      if (e.message === 'DUPLICATE_TITLE') {
        confirmBox('มีเพลงชื่อนี้อยู่แล้ว ต้องการบันทึกเป็นอีกเพลงหรือไม่?', 'บันทึก').then(function (ok) {
          if (ok) {
            saveEditor(true);
          }
        });
        return;
      }
      fail(e);
    });
  }

  function addToBuilder(songId, shift, acc) {
    if (!state.builder) {
      state.builder = newBuilder();
    }
    if (state.builder.items.some(function (it) { return it.songId === songId; })) {
      toast('เพลงนี้อยู่ในชุดเพลงแล้ว');
      return;
    }
    api('getSong', songId).then(function (s) {
      state.builder.items.push({
        songId: s.id,
        title: s.title,
        originalKey: s.originalKey,
        content: s.content,
        shift: shift || 0,
        accidental: acc || 'auto',
        layout: s.defaultLayout || 'auto',
        note: '',
        open: false
      });
      saveBuilder();
      toast('เพิ่ม "' + s.title + '" ลงชุดเพลงแล้ว (' + state.builder.items.length + ' เพลง)');
      renderNav();
      if (state.view === 'library') {
        renderLibraryList();
      }
      if (state.view === 'builder') {
        renderBuilder();
      }
    }).catch(fail);
  }

  function renderBuilder() {
    var b = state.builder;
    var hasNotes = b.description.trim() !== '' || b.items.some(function (it) { return (it.note || '').trim() !== ''; });
    var effectiveDoc = b.outputType === 'doc' || hasNotes;
    $('view').innerHTML =
      '<div class="card"><div class="row"><div class="grow"><h1>สร้างชุดเพลง</h1><div class="muted">เลือกเพลง ปรับคีย์ แล้วสร้างไฟล์สำหรับพิมพ์ (A4 · 2 เพลงต่อหน้า)</div></div>' +
      '<button class="btn danger" id="bClear">ล้างชุดเพลง</button></div></div>' +
      '<div class="card"><div class="grid2">' +
      '<div><label class="f">วันที่ใช้</label><input type="date" id="bDate" value="' + esc(b.serviceDate) + '"></div>' +
      '<div><label class="f">ผู้นำเพลง</label><input type="text" id="bLeader" list="leaderList" value="' + esc(b.leader) + '">' +
      '<datalist id="leaderList">' + state.leaders.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist></div>' +
      '<div style="grid-column:1/-1"><label class="f">หัวกระดาษ</label><input type="text" id="bTitle" value="' + esc(b.title) + '"></div>' +
      '<div style="grid-column:1/-1"><label class="f">คำอธิบาย / รายละเอียด (ถ้าใส่ ไฟล์จะเป็น Word ให้แก้ไขเองได้)</label><textarea id="bDesc" rows="2">' + esc(b.description) + '</textarea></div>' +
      '</div></div>' +
      '<div class="card"><div class="row"><h2 class="grow">เพลงในชุด (' + b.items.length + ')</h2></div>' +
      '<div class="dropdown"><input type="search" id="bPick" placeholder="พิมพ์ชื่อเพลงเพื่อเพิ่ม..." value="' + esc(state.pickerQuery) + '"><div class="menu hide" id="bMenu"></div></div>' +

      '<label class="row" style="gap:6px"><input type="radio" name="bOut" value="doc"' + (effectiveDoc ? ' checked' : '') + '> Word / Google Doc (แก้ไขเองได้)</label>' +
      '</div>' +
      (hasNotes ? '<p class="muted">มีคำอธิบายอยู่ ระบบจะสร้างเป็นไฟล์ Word ให้แก้ไขเอง</p>' : '') +
      '<div style="height:10px"></div><button class="btn primary" id="bGen"' + (b.items.length ? '' : ' disabled') + '>สร้างไฟล์และบันทึกประวัติ</button>' +
      '<div id="bResult"></div></div>';

    $('bDate').onchange = function () {
      b.serviceDate = this.value;
      if (b.titleAuto) {
        b.title = defaultTitle(b.serviceDate);
        $('bTitle').value = b.title;
      }
      saveBuilder();
    };
    $('bLeader').oninput = function () { b.leader = this.value; saveBuilder(); };
    $('bTitle').oninput = function () { b.title = this.value; b.titleAuto = false; saveBuilder(); };
    $('bDesc').oninput = function () { b.description = this.value; saveBuilder(); };
    $('bDesc').onchange = function () { renderBuilder(); };
    Array.prototype.forEach.call(document.querySelectorAll('input[name=bOut]'), function (r) {
      r.onchange = function () { b.outputType = this.value; saveBuilder(); };
    });
    $('bClear').onclick = function () {
      confirmBox('ล้างเพลงทั้งหมดในชุดนี้?', 'ล้าง').then(function (ok) {
        if (ok) {
          state.builder = newBuilder();
          state.lastResult = null;
          saveBuilder();
          render();
        }
      });
    };
    $('bGen').onclick = generate;
    setupPicker();
    renderBuilderItems();
    if (state.lastResult) {
      renderResult(state.lastResult);
    }

  function setupPicker() {
    var input = $('bPick');
    var menu = $('bMenu');
    var show = function () {
      var q = input.value.trim();
      state.pickerQuery = input.value;
      if (!q) {
        menu.classList.add('hide');
        return;
      }
      var taken = {};
      state.builder.items.forEach(function (it) { taken[it.songId] = true; });
      var list = state.songs.filter(function (s) { return !taken[s.id] && songMatches(s, q); }).slice(0, 12);
      if (!list.length) {
        menu.innerHTML = '<div class="muted">ไม่พบเพลง</div>';
      } else {
        menu.innerHTML = list.map(function (s) {
          return '<div data-pick="' + esc(s.id) + '"><b>' + esc(s.title) + '</b> <span class="muted">' + esc(s.originalKey || '') + ' · ใช้ ' + s.useCount + ' ครั้ง</span></div>';
        }).join('');
      }
      menu.classList.remove('hide');
      Array.prototype.forEach.call(menu.querySelectorAll('[data-pick]'), function (d) {
        d.onmousedown = function (e) {
          e.preventDefault();
          state.pickerQuery = '';
          input.value = '';
          menu.classList.add('hide');
          addToBuilder(d.getAttribute('data-pick'), 0, 'auto');
        };
      });
    };
    input.oninput = show;
    input.onfocus = show;
    input.onblur = function () { setTimeout(function () { menu.classList.add('hide'); }, 150); };
  }

  function renderBuilderItems() {
    var b = state.builder;
    var el = $('bItems');
    if (!b.items.length) {
      el.innerHTML = '<p class="muted">ยังไม่มีเพลง เพิ่มจากช่องค้นหาด้านบน หรือจากหน้า "เพลงทั้งหมด"</p>';
      return;
    }
    el.innerHTML = b.items.map(function (it, i) {
      var prepared = it.content ? C.prepareForOutput(it, it.shift, it.accidental) : { key: '', content: '' };
      return '<div class="item" data-i="' + i + '">' +
        '<div class="row"><span class="num">' + (i + 1) + '.</span><b class="grow">' + esc(it.title) + '</b>' +
        '<button class="btn sm" data-act="up"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
        '<button class="btn sm" data-act="down"' + (i === b.items.length - 1 ? ' disabled' : '') + '>↓</button>' +
        '<button class="btn sm danger" data-act="remove">ลบ</button></div>' +
        '<div style="height:8px"></div><div class="row">' +
        '<span class="keybox"><button data-act="kdown">− ½</button><span class="k">' + esc(prepared.key || C.shiftLabel(it.shift)) + '</span><button data-act="kup">+ ½</button></span>' +
        '<span class="muted">' + (it.originalKey ? 'คีย์เดิม ' + esc(it.originalKey) + ' · ' : '') + 'เลื่อน ' + C.shiftLabel(it.shift) + '</span>' +
        '<select data-act="acc" style="width:auto">' + ['auto', 'sharp', 'flat'].map(function (a) { return '<option value="' + a + '"' + (it.accidental === a ? ' selected' : '') + '>' + (a === 'auto' ? '#/b อัตโนมัติ' : 'ใช้ ' + ACC_LABEL[a]) + '</option>'; }).join('') + '</select>' +
        '<select data-act="layout" style="width:auto">' + ['auto', 'half', 'full'].map(function (l) { return '<option value="' + l + '"' + (it.layout === l ? ' selected' : '') + '>' + LAYOUT_LABEL[l] + '</option>'; }).join('') + '</select>' +
        '<button class="btn sm" data-act="toggle">' + (it.open ? 'ซ่อนตัวอย่าง' : 'ดูตัวอย่าง') + '</button>' +
        '</div><div style="height:8px"></div>' +
        '<textarea data-act="note" rows="1" placeholder="คำอธิบายของเพลงนี้ (ถ้ามี)">' + esc(it.note || '') + '</textarea>' +
        (it.open ? '<div class="sheet" style="margin-top:10px;font-size:14px">' + C.renderHtml(prepared.content) + '</div>' : '') +
        '</div>';
    }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('.item'), function (card) {
      var i = Number(card.getAttribute('data-i'));
      var it = b.items[i];
      Array.prototype.forEach.call(card.querySelectorAll('[data-act]'), function (c) {
        var act = c.getAttribute('data-act');
        if (act === 'note') {
          c.oninput = function () { it.note = this.value; saveBuilder(); };
          c.onchange = function () { renderBuilder(); };
          return;
        }
        if (act === 'acc' || act === 'layout') {
          c.onchange = function () {
            if (act === 'acc') { it.accidental = this.value; } else { it.layout = this.value; }
            saveBuilder();
            renderBuilderItems();
          };
          return;
        }
        c.onclick = function () {
          if (act === 'up' && i > 0) { b.items.splice(i - 1, 0, b.items.splice(i, 1)[0]); }
          if (act === 'down' && i < b.items.length - 1) { b.items.splice(i + 1, 0, b.items.splice(i, 1)[0]); }
          if (act === 'remove') { b.items.splice(i, 1); }
          if (act === 'kup') { it.shift = shiftStep(it.shift, 1); }
          if (act === 'kdown') { it.shift = shiftStep(it.shift, -1); }
          if (act === 'toggle') { it.open = !it.open; }
          saveBuilder();
          if (act === 'remove') {
            renderBuilder();
            renderNav();
          } else {
            renderBuilderItems();
          }
        };
      });
    });
  }

  function generate() {
    var b = state.builder;
    if (b.items.some(function (it) { return !it.content; })) {
      toast('กำลังโหลดเนื้อเพลง กรุณารอสักครู่แล้วลองใหม่', true);
      return;
    }
    var items = b.items.map(function (it) {
      var p = C.prepareForOutput(it, it.shift, it.accidental);
      return { songId: it.songId, title: it.title, key: p.key, shift: it.shift, accidental: it.accidental, layout: it.layout, note: it.note || '', content: p.content };
    });
    var payload = { title: b.title, serviceDate: b.serviceDate, leader: b.leader, description: b.description, outputType: b.outputType, items: items };
    $('bGen').disabled = true;
    $('bResult').innerHTML = '<p class="muted">กำลังสร้างไฟล์... อาจใช้เวลา 10-40 วินาที</p>';
    api('generateSetlist', payload).then(function (res) {
      state.lastResult = res;
      $('bGen').disabled = false;
      renderResult(res);
      toast('สร้างไฟล์และบันทึกประวัติแล้ว');
      refreshSongs();
      api('listLeaderNames').then(function (names) { state.leaders = names; }).catch(function () {});
    }).catch(function (e) {
      $('bGen').disabled = false;
      $('bResult').innerHTML = '';
      fail(e);
    });
  }

  function linkButtons(r) {
    var out = [];
    if (r.docUrl) {
      out.push('<a class="btn primary" target="_blank" href="' + esc(r.docUrl) + '">เปิดแก้ไขใน Google Docs</a>');
      out.push('<a class="btn" target="_blank" href="' + esc(r.docxUrl) + '">ดาวน์โหลด Word (.docx)</a>');
    }
    if (r.pdfUrl) {
      out.push('<a class="btn' + (r.docUrl ? '' : ' primary') + '" target="_blank" href="' + esc(r.pdfUrl) + '">เปิด PDF</a>');
      out.push('<a class="btn" target="_blank" href="' + esc(r.pdfDownloadUrl) + '">ดาวน์โหลด PDF</a>');
    }
    return out.join('');
  }

  function renderResult(r) {
    var el = $('bResult');
    if (!el) {
      return;
    }
    el.innerHTML = '<div style="height:12px"></div><div class="help" style="color:var(--ink)">' +
      '<b>สร้างเสร็จแล้ว</b> (' + (r.outputType === 'doc' ? 'Word / Google Doc' : 'PDF') + ')' +
      '<div class="result-links">' + linkButtons(r) +
      (r.docUrl ? '<button class="btn" id="rPdf">แก้ไขเสร็จแล้ว → สร้าง PDF</button>' : '') + '</div>' +
      '<div style="height:6px"></div>' + r.pages.map(function (p) {
        return '<div class="muted">หน้า ' + p.page + ': ' + p.songs.map(esc).join(' | ') + '</div>';

      $('rPdf').onclick = function () {
        api('exportSetlistPdf', r.setlistId).then(function (links) {
          r.pdfId = links.pdfId;

          r.pdfDownloadUrl = links.pdfDownloadUrl;
          renderResult(r);
          toast('สร้าง PDF จากไฟล์ที่แก้ไขแล้ว');
        }).catch(fail);
      };

  function renderHistory() {

      '<div style="height:10px"></div><input type="search" id="hSearch" placeholder="ค้นหาชื่อ ผู้นำเพลง หรือเพลง"></div>' +
      '<div class="card"><div id="hList"><p class="muted">กำลังโหลด...</p></div></div>';

      state.setlists = list;
      renderHistoryList();

          if (!ok) {
            return;
          }
          api('deleteSetlist', btn.getAttribute('data-del')).then(function () {
            toast('ลบแล้ว');
            refreshSongs();
            renderHistory();
          }).catch(fail);
        });

  function reuseSetlist(id) {
    var go2 = function () {
      api('getSetlist', id).then(function (s) {
        var ids = s.items.map(function (it) { return it.songId; });
        return api('getSongs', ids).then(function (map) {
          var date = nextSunday();
          var b = newBuilder();
          b.serviceDate = date;
          b.title = defaultTitle(date);
          b.description = s.description || '';
          var missing = 0;
          b.items = s.items.filter(function (it) {
            if (!map[it.songId]) {
              missing++;
              return false;
            }
            return true;
          }).map(function (it) {
            var song = map[it.songId];
            return { songId: song.id, title: song.title, originalKey: song.originalKey, content: song.content, shift: it.shift || 0, accidental: it.accidental || 'auto', layout: it.layout || 'auto', note: it.note || '', open: false };
          });
          state.builder = b;
          state.lastResult = null;
          saveBuilder();
          if (missing) {
            toast('มี ' + missing + ' เพลงที่ถูกลบไปแล้ว ไม่ได้นำมาด้วย', true);
          } else {
            toast('โหลดชุดเพลงแล้ว ปรับแก้ได้ตามต้องการ');
          }
          go('builder');
        });
      }).catch(fail);
    };
    if (state.builder && state.builder.items.length) {
      confirmBox('ชุดเพลงปัจจุบันจะถูกแทนที่ ต้องการดำเนินการต่อ?', 'แทนที่').then(function (ok) { if (ok) { go2(); } });
    } else {
      go2();
    }
  }

  function renderStats() {

      '<div class="grow"><label class="f">ผู้นำเพลง</label><select id="sLeader"><option value="">ทุกคน</option>' + state.leaders.map(function (n) { return '<option value="' + esc(n) + '"' + (f.leader === n ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') + '</select></div>' +
      '<div><label class="f">&nbsp;</label><button class="btn primary" id="sGo">แสดงผล</button></div>' +

  function loadStats() {
    api('getStats', state.statsFilter).then(function (st) {
      state.stats = st;
      if (!state.statsLeader || !st.leaders.some(function (l) { return l.leader === state.statsLeader; })) {
        state.statsLeader = st.leaders.length ? st.leaders[0].leader : '';
      }
      renderStatsBody();
    }).catch(fail);
  }

  function songTable(rows, extraCol) {
    if (!rows.length) {
      return '<p class="muted">ยังไม่มีข้อมูล</p>';
    }
    var max = rows[0].count || 1;
    return '<table class="list"><thead><tr><th>#</th><th>เพลง</th><th>จำนวนครั้ง</th><th>คีย์ที่ใช้บ่อย</th>' + (extraCol ? '<th>ผู้นำที่ใช้บ่อย</th>' : '') + '<th>ใช้ล่าสุด</th></tr></thead><tbody>' +
      rows.map(function (r, i) {
        return '<tr><td>' + (i + 1) + '</td><td><span class="song-title-link" data-open="' + esc(r.songId) + '">' + esc(r.title) + '</span></td>' +
          '<td><div class="row" style="gap:8px"><div class="bar" style="width:90px"><span style="width:' + Math.round(r.count / max * 100) + '%"></span></div>' + r.count + '</div></td>' +
          '<td>' + (r.topKey ? '<span class="pill">' + esc(r.topKey) + '</span>' : '-') + '</td>' +
          (extraCol ? '<td>' + esc(r.topLeader || '-') + '</td>' : '') +
          '<td>' + esc(thaiShortDate(r.last)) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  function renderStatsBody() {
    var st = state.stats;
    var leader = st.leaders.filter(function (l) { return l.leader === state.statsLeader; })[0];
    $('sBody').innerHTML =
      '<div class="grid2">' +
      '<div class="card"><div class="muted">จำนวนชุดเพลง</div><div class="stat-num">' + st.totalSetlists + '</div></div>' +
      '<div class="card"><div class="muted">จำนวนครั้งที่ใช้เพลงรวม</div><div class="stat-num">' + st.totalUses + '</div></div>' +
      '</div>' +
      '<div class="card"><h2>เพลงที่ถูกเลือกใช้บ่อยที่สุด</h2>' + songTable(st.topSongs.slice(0, 30), true) + '</div>' +
      '<div class="card"><div class="row"><h2 class="grow">เพลงที่ผู้นำเพลงแต่ละคนใช้บ่อย</h2>' +
      '<select id="sL" style="width:auto">' + st.leaders.map(function (l) { return '<option value="' + esc(l.leader) + '"' + (l.leader === state.statsLeader ? ' selected' : '') + '>' + esc(l.leader) + ' (' + l.setlistCount + ' ชุด)</option>'; }).join('') + '</select></div>' +
      (leader ? '<p class="muted">นำทั้งหมด ' + leader.setlistCount + ' ชุด · ใช้เพลง ' + leader.total + ' ครั้ง · ' + leader.songs.length + ' เพลงไม่ซ้ำ</p>' + songTable(leader.songs.slice(0, 30), false) : '<p class="muted">ยังไม่มีข้อมูล</p>') +
      '</div>' +
      '<div class="card"><h2>สรุปผู้นำเพลง</h2>' + (st.leaders.length ? '<table class="list"><thead><tr><th>ผู้นำเพลง</th><th>จำนวนชุด</th><th>เพลงที่ใช้บ่อยที่สุด</th></tr></thead><tbody>' +
        st.leaders.map(function (l) {
          return '<tr><td>' + esc(l.leader) + '</td><td>' + l.setlistCount + '</td><td>' + (l.songs[0] ? esc(l.songs[0].title) + ' (' + l.songs[0].count + ' ครั้ง)' : '-') + '</td></tr>';
        }).join('') + '</tbody></table>' : '<p class="muted">ยังไม่มีข้อมูล</p>') + '</div>' +
      (st.neverUsed.length ? '<div class="card"><h2>เพลงที่ยังไม่เคยถูกใช้ (' + st.neverUsed.length + ')</h2><div>' + st.neverUsed.map(function (s) { return '<span class="pill gray song-title-link" data-open="' + esc(s.songId) + '" style="margin:3px">' + esc(s.title) + '</span>'; }).join('') + '</div></div>' : '');
    if ($('sL')) {
      $('sL').onchange = function () { state.statsLeader = this.value; renderStatsBody(); };
    }
    Array.prototype.forEach.call($('sBody').querySelectorAll('[data-open]'), function (b) {
      b.onclick = function () { openSong(b.getAttribute('data-open')); };
    });
  }

  function renderUsers() {
    if (!can('admin')) {
      go('library');
      return;
    }
    $('view').innerHTML = '<div class="card"><div class="row"><h1 class="grow">จัดการผู้ใช้</h1><button class="btn primary" id="uNew">+ เพิ่มผู้ใช้</button></div></div>' +
      '<div class="card"><div id="uList"><p class="muted">กำลังโหลด...</p></div></div>';
    $('uNew').onclick = function () { userForm(null); };
    api('listUsers').then(function (users) {
      state.users = users;
      $('uList').innerHTML = '<table class="list"><thead><tr><th>Username</th><th>ชื่อที่แสดง</th><th>สิทธิ์</th><th>สถานะ</th><th></th></tr></thead><tbody>' +
        users.map(function (u, i) {
          return '<tr><td>' + esc(u.username) + '</td><td>' + esc(u.displayName) + '</td><td>' + esc(ROLE_LABEL[u.role] || u.role) + '</td>' +
            '<td>' + (u.active ? '<span class="pill">ใช้งาน</span>' : '<span class="pill gray">ปิดใช้งาน</span>') + '</td>' +
            '<td style="text-align:right"><button class="btn sm" data-u="' + i + '">แก้ไข</button></td></tr>';
        }).join('') + '</tbody></table>';
      Array.prototype.forEach.call($('uList').querySelectorAll('[data-u]'), function (b) {
        b.onclick = function () { userForm(state.users[Number(b.getAttribute('data-u'))]); };
      });
    }).catch(fail);
  }

  function userForm(u) {
    var isNew = !u;
    u = u || { username: '', displayName: '', role: 'leader', active: true };
    modal('<h3>' + (isNew ? 'เพิ่มผู้ใช้' : 'แก้ไขผู้ใช้') + '</h3>' +
      '<label class="f">Username</label><input type="text" id="fU" value="' + esc(u.username) + '"' + (isNew ? '' : ' disabled') + '>' +
      '<div style="height:8px"></div><label class="f">ชื่อที่แสดง (ใช้เป็นชื่อผู้นำเพลง)</label><input type="text" id="fN" value="' + esc(u.displayName) + '">' +
      '<div style="height:8px"></div><label class="f">สิทธิ์</label><select id="fR">' +
      ['viewer', 'leader', 'admin'].map(function (r) { return '<option value="' + r + '"' + (u.role === r ? ' selected' : '') + '>' + ROLE_LABEL[r] + '</option>'; }).join('') + '</select>' +
      '<div style="height:8px"></div><label class="f">' + (isNew ? 'รหัสผ่าน (อย่างน้อย 6 ตัว)' : 'รหัสผ่านใหม่ (เว้นว่างถ้าไม่เปลี่ยน)') + '</label><input type="text" id="fP" autocomplete="off">' +
      (isNew ? '' : '<div style="height:8px"></div><label class="row" style="gap:6px"><input type="checkbox" id="fA"' + (u.active ? ' checked' : '') + '> เปิดใช้งาน</label>') +
      '<div style="height:14px"></div><div class="row" style="justify-content:flex-end"><button class="btn" id="fC">ยกเลิก</button><button class="btn primary" id="fS">บันทึก</button></div>', function () {
      $('fC').onclick = closeModal;
      $('fS').onclick = function () {
        var data = {
          username: $('fU').value,
          displayName: $('fN').value,
          role: $('fR').value,
          password: $('fP').value,
          active: isNew ? true : $('fA').checked
        };
        api('saveUser', data).then(function () {
          closeModal();
          toast('บันทึกผู้ใช้แล้ว');
          renderUsers();
          api('listLeaderNames').then(function (names) { state.leaders = names; }).catch(function () {});
        }).catch(fail);
      };
    });
  }

  function renderAccount() {
    $('view').innerHTML = '<div class="card" style="max-width:480px"><h1>บัญชีของฉัน</h1>' +
      '<p class="muted">' + esc(state.user.displayName) + ' (' + esc(state.user.username) + ') · ' + esc(ROLE_LABEL[state.user.role] || '') + '</p>' +
      '<h3>เปลี่ยนรหัสผ่าน</h3>' +
      '<label class="f">รหัสผ่านเดิม</label><input type="password" id="aOld">' +
      '<div style="height:8px"></div><label class="f">รหัสผ่านใหม่</label><input type="password" id="aNew">' +
      '<div style="height:8px"></div><label class="f">ยืนยันรหัสผ่านใหม่</label><input type="password" id="aNew2">' +
      '<div style="height:12px"></div><button class="btn primary" id="aSave">เปลี่ยนรหัสผ่าน</button></div>';
    $('aSave').onclick = function () {
      if ($('aNew').value !== $('aNew2').value) {
        toast('รหัสผ่านใหม่ไม่ตรงกัน', true);
        return;
      }
      api('changeMyPassword', $('aOld').value, $('aNew').value).then(function () {
        toast('เปลี่ยนรหัสผ่านแล้ว');
        $('aOld').value = '';
        $('aNew').value = '';
        $('aNew2').value = '';
      }).catch(fail);
    };
  }

  function boot() {
    var token = load('cs_token');
    if (!token) {
      renderLogin();
      return;
    }
    state.token = token;
    api('getMe').then(function (user) {
      state.user = user;
      afterLogin();
    }).catch(function () {
      if (!state.user) {
        forceLogout();
      }
    });
  }

  boot();
})();
</script>
