<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --ink: #1d2330;
    --muted: #6b7385;
    --line: #e2e5ee;
    --brand: #2f4fb5;
    --brand-soft: #e8eefc;
    --chord: #1f3f9a;
    --danger: #c0392b;
    --ok: #1e8e4e;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: 'Sarabun', Tahoma, sans-serif; font-size: 15px; }
  a { color: var(--brand); }
  button, input, select, textarea { font-family: inherit; font-size: 14px; }
  .topbar { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 6px; padding: 8px 14px; flex-wrap: wrap; }
  .brand { font-weight: 700; color: var(--brand); margin-right: 10px; font-size: 16px; }
  .nav { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
  .nav button { background: none; border: none; padding: 7px 11px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .nav button.active, .nav button:hover { background: var(--brand-soft); color: var(--brand); }
  .who { color: var(--muted); font-size: 13px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grow { flex: 1; min-width: 180px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
  label.f { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  input[type=text], input[type=password], input[type=date], input[type=search], select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
  textarea { resize: vertical; line-height: 1.5; }
  textarea.code { font-family: 'Sarabun', monospace; min-height: 420px; font-size: 15px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-weight: 600; color: var(--ink); text-decoration: none; }
  .btn:hover { border-color: var(--brand); color: var(--brand); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); color: #fff; }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { border-color: var(--danger); }
  .btn.sm { padding: 4px 9px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-size: 12px; font-weight: 600; }
  .pill.gray { background: #eef0f4; color: var(--muted); }
  table.list { width: 100%; border-collapse: collapse; }
  table.list th, table.list td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.list th { font-size: 13px; color: var(--muted); font-weight: 600; }
  table.list tr:hover td { background: #fafbfe; }
  .song-title-link { font-weight: 700; cursor: pointer; color: var(--ink); }
  .song-title-link:hover { color: var(--brand); }
  .keybox { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: #fff; }
  .keybox .k { min-width: 64px; text-align: center; font-weight: 700; color: var(--chord); }
  .keybox button { border: none; background: var(--brand-soft); color: var(--brand); border-radius: 6px; padding: 4px 9px; cursor: pointer; font-weight: 700; }
  .sheet { font-size: 16px; line-height: 1.35; overflow-x: auto; }
  .cl-line { display: flex; flex-wrap: wrap; align-items: flex-end; margin: 2px 0; }
  .cl-seg { display: inline-flex; flex-direction: column; }
  .cl-c { color: var(--chord); font-weight: 700; white-space: pre; min-height: 1.3em; }
  .cl-seg.has-chord .cl-c { padding-right: .4em; }
  .cl-l { white-space: pre; }
  .cl-text { white-space: pre-wrap; margin: 2px 0; }
  .cl-inline { white-space: pre-wrap; margin: 2px 0; }
  .cl-chord-inline { color: var(--chord); }
  .cl-section { font-weight: 700; margin: 6px 0 2px; }
  .cl-blank { height: .7em; }
  .item { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; background: #fff; }
  .item .num { font-weight: 700; color: var(--brand); min-width: 26px; }
  .dropdown { position: relative; }
  .dropdown .menu { position: absolute; left: 0; right: 0; top: 100%; background: #fff; border: 1px solid var(--line); border-radius: 8px; max-height: 300px; overflow: auto; z-index: 10; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
  .dropdown .menu div { padding: 8px 10px; cursor: pointer; border-bottom: 1px solid #f1f2f6; }
  .dropdown .menu div:hover { background: var(--brand-soft); }
  .login { max-width: 380px; margin: 80px auto; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1d2330; color: #fff; padding: 10px 18px; border-radius: 8px; z-index: 99; max-width: 90%; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
  .toast.err { background: var(--danger); }
  .overlay { position: fixed; inset: 0; background: rgba(20,24,35,.45); display: flex; align-items: center; justify-content: center; z-index: 90; padding: 16px; }
  .modal { background: #fff; border-radius: 12px; padding: 20px; max-width: 460px; width: 100%; }
  .loading { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--brand), #8aa4f0, var(--brand)); background-size: 200% 100%; animation: ld 1s linear infinite; z-index: 100; }
  @keyframes ld { from { background-position: 0 0; } to { background-position: -200% 0; } }
  .help { background: #fafbfe; border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--muted); }
  .help code { background: #eef0f4; padding: 1px 5px; border-radius: 4px; color: var(--ink); }
  .stat-num { font-size: 28px; font-weight: 700; color: var(--brand); }
  .bar { height: 8px; background: var(--brand-soft); border-radius: 4px; overflow: hidden; min-width: 60px; }
  .bar span { display: block; height: 100%; background: var(--brand); }
  .result-links .btn { margin: 4px 6px 4px 0; }
  .hide { display: none !important; }
</style>
